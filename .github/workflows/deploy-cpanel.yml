# Despliegue continuo automático de Frontend Etronic hacia cPanel (etronic.com.mx) vía HTTPS 443
name: Build & Deploy Frontend to cPanel

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-frontend-cpanel
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Compilar con Vite+ y publicar en etronic.com.mx (HTTPS 443)
    runs-on: ubuntu-latest

    steps:
      - name: 1. Descargar código fuente
        uses: actions/checkout@v4

      - name: 2. Configurar Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: 3. Instalar dependencias
        run: npm ci

      - name: 4. Verificar formato, linter y tipos (Vite+)
        run: npm run check

      - name: 5. Compilar bundle de producción (dist/)
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
        run: npm run build

      - name: 6. Publicar dist/ en etronic.com.mx vía HTTPS (Puerto 443)
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN || secrets.FTP_PASSWORD }}
        run: |
          node - << 'EOF'
          const fs = require("fs");
          const path = require("path");

          const distDir = path.resolve("dist");
          const files = {};

          function walk(dir) {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const full = path.join(dir, entry.name);
              if (entry.isDirectory()) {
                walk(full);
              } else {
                const rel = path.relative(distDir, full).replace(/\\/g, "/");
                if (rel === ".htaccess") continue;
                files[rel] = fs.readFileSync(full).toString("base64");
              }
            }
          }
          walk(distDir);

          (async () => {
            const token = (process.env.DEPLOY_TOKEN || "").trim();
            if (!token) {
              console.error("Falta configurar el secret DEPLOY_TOKEN en GitHub.");
              process.exit(1);
            }

            const entries = Object.entries(files);
            // Subir index.html al final cuando todos los nuevos assets JS/CSS ya existen en disco
            entries.sort(([a], [b]) => {
              const isLastA = a === "index.html" ? 1 : 0;
              const isLastB = b === "index.html" ? 1 : 0;
              return isLastA - isLastB;
            });

            const MAX_BATCH_BYTES = 2.5 * 1024 * 1024;
            const batches = [];
            let currentBatch = {};
            let currentBytes = 0;

            for (const [relPath, b64] of entries) {
              const itemBytes = relPath.length + b64.length + 16;
              if (currentBytes + itemBytes > MAX_BATCH_BYTES && Object.keys(currentBatch).length > 0) {
                batches.push(currentBatch);
                currentBatch = {};
                currentBytes = 0;
              }
              currentBatch[relPath] = b64;
              currentBytes += itemBytes;
            }
            if (Object.keys(currentBatch).length > 0) {
              batches.push(currentBatch);
            }

            console.log(`Enviando ${entries.length} archivos en ${batches.length} lote(s) a https://etronic.com.mx/deploy-hook.php ...`);
            for (let i = 0; i < batches.length; i++) {
              const batch = batches[i];
              console.log(`Subiendo lote ${i + 1}/${batches.length} (${Object.keys(batch).length} archivos)...`);
              const res = await fetch("https://etronic.com.mx/deploy-hook.php", {
                method: "POST",
                headers: {
                  "Content-Type": "application/json",
                  "X-Deploy-Token": token,
                },
                body: JSON.stringify({ target: "frontend", files: batch }),
              });
              const text = await res.text();
              console.log(`Lote ${i + 1} HTTP ${res.status}:`, text);
              if (!res.ok) process.exit(1);
            }
          })();
          EOF
