# Despliegue continuo automático de Frontend Etronic hacia cPanel (etronic.com.mx)
name: Build & Deploy Frontend to cPanel

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-frontend-cpanel
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Compilar con Vite+ y publicar en cPanel
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código fuente
        uses: actions/checkout@v4

      - name: Configurar Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Instalar dependencias
        run: npm ci

      - name: Verificar formato, linter y tipos (Vite+)
        run: npm run check

      - name: Compilar bundle de producción (dist/)
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
        run: npm run build

      - name: Desplegar dist/ hacia carpeta de etronic.com.mx en cPanel vía FTPS
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          python3 - <<'PY'
          import ftplib
          import os
          import socket
          import ssl
          from pathlib import Path

          host = os.environ["FTP_SERVER"].strip()
          user = os.environ["FTP_USERNAME"].strip()
          password = os.environ["FTP_PASSWORD"]
          remote_root = (os.environ.get("FTP_SERVER_DIR") or "").strip().strip("/")
          local_root = Path("dist")

          resolved_ip = socket.gethostbyname(host)
          print(f"[1/4] Conectando por TCP a {host} ({resolved_ip}:21)...")

          class ReusableTLSFTP(ftplib.FTP_TLS):
              def ntransfercmd(self, cmd, rest=None):
                  conn, size = ftplib.FTP.ntransfercmd(self, cmd, rest)
                  if self._prot_p:
                      conn = self.context.wrap_socket(
                          conn,
                          server_hostname=self.host,
                          session=self.sock.session,
                      )
                  return conn, size

              def makepasv(self):
                  _pasv_host, pasv_port = super().makepasv()
                  return resolved_ip, pasv_port

          ctx = ssl.create_default_context()
          ctx.check_hostname = False
          ctx.verify_mode = ssl.CERT_NONE
          ctx.maximum_version = ssl.TLSVersion.TLSv1_2

          ftp = ReusableTLSFTP(context=ctx)
          ftp.connect(host=resolved_ip, port=21, timeout=25)
          print(f"[2/4] Banner recibido: {ftp.getwelcome().splitlines()[0]}")
          ftp.auth()
          ftp.login(user=user, passwd=password)
          ftp.prot_p()
          print("[3/4] Autenticación FTPS exitosa. Verificando canal pasivo de datos...")

          if remote_root:
              for part in remote_root.split("/"):
                  if not part:
                      continue
                  try:
                      ftp.cwd(part)
                  except ftplib.error_perm:
                      ftp.mkd(part)
                      ftp.cwd(part)

          base_pwd = ftp.pwd()
          print(f"      Directorio remoto activo: {base_pwd}")
          ftp.nlst()
          print("      Canal de datos pasivo verificado OK.")

          ensured_dirs = set()

          def ensure_remote_dir(rel_dir: str):
              if not rel_dir or rel_dir == "." or rel_dir in ensured_dirs:
                  return
              ftp.cwd(base_pwd)
              current = ""
              for segment in rel_dir.split("/"):
                  current = f"{current}/{segment}" if current else segment
                  if current in ensured_dirs:
                      ftp.cwd(segment)
                      continue
                  try:
                      ftp.cwd(segment)
                  except ftplib.error_perm:
                      ftp.mkd(segment)
                      ftp.cwd(segment)
                  ensured_dirs.add(current)

          uploaded = 0
          for file_path in sorted(local_root.rglob("*")):
              if not file_path.is_file():
                  continue
              rel = file_path.relative_to(local_root).as_posix()
              if (
                  rel == ".htaccess"
                  or rel.startswith("cgi-bin/")
                  or rel.startswith(".well-known/")
                  or rel.startswith("apietronic/")
              ):
                  continue
              parent = os.path.dirname(rel)
              fname = os.path.basename(rel)
              ensure_remote_dir(parent)
              target_dir = f"{base_pwd.rstrip('/')}/{parent}" if parent else base_pwd
              ftp.cwd(target_dir)
              with file_path.open("rb") as fh:
                  ftp.storbinary(f"STOR {fname}", fh)
              uploaded += 1

          ftp.quit()
          print(f"[4/4] Despliegue Frontend completado: {uploaded} archivos publicados en etronic.com.mx.")
          PY
